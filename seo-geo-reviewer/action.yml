name: "Agent Mag SEO/GEO Auto-Fix Review"
description: >
  AI-powered SEO + GEO review that AUTO-FIXES issues on your PRs.
  Reads full file contents, calls GPT-5.4 (or Claude fallback) to produce
  search/replace patches, applies them as a commit to the PR branch,
  and posts a branded summary comment.
author: "Agent Mag"
branding:
  icon: "search"
  color: "gray-dark"

inputs:
  github-token:
    description: "GITHUB_TOKEN with contents:write + pull-requests:write"
    required: true
  pr-number:
    description: "Pull request number"
    required: true
  base-sha:
    description: "PR base SHA"
    required: true
  head-sha:
    description: "PR head SHA"
    required: true
  azure-openai-endpoint:
    description: "Azure OpenAI endpoint"
    required: false
  azure-openai-deployment:
    description: "Azure OpenAI deployment name"
    required: false
  azure-openai-api-version:
    description: "Azure OpenAI API version"
    required: false
    default: "2025-04-01-preview"
  azure-openai-api-key:
    description: "Azure OpenAI API key"
    required: false
  anthropic-api-key:
    description: "Anthropic API key (fallback, or primary if no Azure)"
    required: false
  comment-pr:
    description: "Post comments on the PR"
    required: false
    default: "true"
  auto-fix:
    description: "Apply auto-fix patches to the PR branch"
    required: false
    default: "true"

outputs:
  findings-count:
    description: "Total remaining findings (after auto-fix)"
    value: ${{ steps.review.outputs.findings_count }}
  summary:
    description: "Summary string (high/med/low)"
    value: ${{ steps.review.outputs.summary }}

runs:
  using: "composite"
  steps:
    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ github.action_path }}/requirements.txt

    - name: Run SEO/GEO Auto-Fix Review
      id: review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        AZURE_OPENAI_ENDPOINT: ${{ inputs.azure-openai-endpoint }}
        AZURE_OPENAI_DEPLOYMENT: ${{ inputs.azure-openai-deployment }}
        AZURE_OPENAI_API_VERSION: ${{ inputs.azure-openai-api-version }}
        AZURE_OPENAI_API_KEY: ${{ inputs.azure-openai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        COMMENT_PR: ${{ inputs.comment-pr }}
        AUTO_FIX: ${{ inputs.auto-fix }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python "${{ github.action_path }}/review.py"

    - name: Upload findings artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: seo-geo-review-findings
        path: seo-geo-findings.json
        if-no-files-found: ignore
